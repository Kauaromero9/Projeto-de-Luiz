
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Principal - Mercado Verde</title>

    
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #f4f7f4;
        color: #333;
    }

    header {
        background-color: #176b4d;
        padding: 20px;
    }

    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 20px;
        max-width: 1200px;
        margin: auto;
    }

    nav h1 {
        color: white;
        font-size: 24px;
    }

    nav ul {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
    }

    nav ul li a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        font-weight: bold;
        transition: 0.3s;
    }

    nav ul li a:hover {
        color: #b8e6c9;
    }

    main {
        text-align: center;
        padding: 80px 20px;
    }

    main h2 {
        color: #176b4d;
        font-size: 32px;
        margin-bottom: 20px;
    }

    main p {
        font-size: 18px;
        margin-bottom: 30px;
        line-height: 1.6;
    }

    main a {
        display: inline-block;
        background-color: #176b4d;
        color: white;
        text-decoration: none;
        padding: 12px 25px;
        border-radius: 8px;
        font-weight: bold;
        transition: 0.3s;
    }

    main a:hover {
        background-color: #104b37;
    }

    footer {
        background-color: #176b4d;
        color: white;
        text-align: center;
        padding: 20px;
    }

    @media (max-width: 768px) {
        nav {
            flex-direction: column;
        }

        nav ul {
            justify-content: center;
            gap: 15px;
        }

        nav h1 {
            text-align: center;
        }

        main h2 {
            font-size: 26px;
        }
    }
</style>


</head>
<body>

    <header>
        <nav>
            <h1> Mercado Verde</h1>

            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="produtos_melhorado.html">Produtos</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="sobre.html">Sobre a loja</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Bem-vindo ao Mercado Verde!</h2>
            <p>
                Encontre produtos de qualidade para o seu dia a dia.
                Faça suas compras de forma simples e prática.
            </p>

            <a href="produtos.html">Ver produtos</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mercado Verde. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
